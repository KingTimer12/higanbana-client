[package]
name = "higanbana-gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = ["wgpu", "shaders"]
# Registra o backend WGPU (Rust) no core.
wgpu = ["higanbana-gpui-sys/wgpu"]
# Player de vídeo (libmpv carregada em runtime).
video = ["dep:libloading"]
# Shaders WGSL do usuário traduzidos pelo naga em tempo de execução.
shaders = ["dep:naga"]

[dependencies]
higanbana-gpui-sys.workspace = true
# Mesma versão do Cargo.lock; só os algoritmos usados (flexbox).
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
# Movimento do cursor por grafema (emoji com ZWJ, acentos combinantes).
unicode-segmentation = "1.13.3"
# Rasteriza os ícones SVG (sem texto nem imagens embutidas).
resvg = { version = "0.45", default-features = false }
libloading = { workspace = true, optional = true }
serde_json.workspace = true
# Mesma versão do build do -sys (=30.0.1): WGSL -> HLSL/GLSL/SPIR-V dos shaders do usuário.
naga = { version = "=30.0.1", optional = true, default-features = false, features = ["wgsl-in", "hlsl-out", "glsl-out", "spv-out"] }

[[test]]
name = "video"
required-features = ["video"]

[[test]]
name = "video_gpu"
required-features = ["video"]

[[test]]
name = "video_missing"
required-features = ["video"]

[[example]]
name = "video_player"
required-features = ["video"]
