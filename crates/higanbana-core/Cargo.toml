[package]
name = "higanbana-core"
description = "Núcleo do higanbana: sessão, nuvem, AniList, leitor de mangá, proxy de vídeo e motor de música"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
regex.workspace = true
thiserror.workspace = true
sha2.workspace = true
getrandom.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
urlencoding.workspace = true
flate2.workspace = true
unrar = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
ebur128 = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
souvlaki = { workspace = true, optional = true }
dirs.workspace = true
open.workspace = true

[features]
default = ["music", "reader"]
# Motor de música (decodificação, saída de áudio, teclas de mídia). Só desktop.
music = ["dep:symphonia", "dep:rubato", "dep:ebur128", "dep:cpal", "dep:souvlaki"]
# Leitor de mangá (zip/rar).
reader = ["dep:unrar"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
