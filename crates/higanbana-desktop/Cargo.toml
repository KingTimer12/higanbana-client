[package]
name = "higanbana-desktop"
description = "Aplicativo desktop não oficial para navegar no acervo da Anitsu"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "higanbana"
path = "src/main.rs"

[dependencies]
higanbana-core.workspace = true
gpui-kit.workspace = true
raw-window-handle.workspace = true
futures.workspace = true
libloading.workspace = true
serde_json.workspace = true
base64.workspace = true
image.workspace = true
tracing.workspace = true
rav1d.workspace = true
avif-parse.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
tokio.workspace = true
# Hash rápido para mapas internos (chaves não adversárias); já vem pelo gpui.
rustc-hash = "2"
# Perfilador: sem a feature `hotpath`, as macros viram no-op (custo zero).
hotpath.workspace = true

[features]
# Liga o perfilador hotpath no app; o relatório sai ao fechar o app.
# `cargo run -p higanbana-desktop --release --features hotpath`
hotpath = ["hotpath/hotpath"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
