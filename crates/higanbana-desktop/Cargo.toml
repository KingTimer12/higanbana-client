[package]
name = "higanbana-desktop"
description = "Aplicativo desktop não oficial para navegar no acervo da Anitsu"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "higanbana"
path = "src/main.rs"

[dependencies]
higanbana-core = { path = "../higanbana-core" }
gpui-kit = "0.9"
raw-window-handle = "0.6"
futures = "0.3"
libloading = "0.8"
serde_json = "1"
base64 = "0.22"
image = "0.25"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
