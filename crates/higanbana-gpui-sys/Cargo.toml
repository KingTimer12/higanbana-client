[package]
name = "higanbana-gpui-sys"
version.workspace = true
authors.workspace = true
edition.workspace = true
links = "hgui"
description = "FFI cru para o core C do higanbana-gpui"

[build-dependencies]
cc.workspace = true
bindgen.workspace = true
# Mesma versão do Cargo.lock (via wgpu): WGSL -> SPIR-V para o backend Vulkan.
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
