[workspace]
resolver = "3"
members = ["crates/higanbana-core", "crates/higanbana-desktop", "crates/higanbana-gpui", "crates/higanbana-gpui-sys"]

[workspace.package]
version = "0.1.0"
authors = ["Aaron King"]
edition = "2024"

[workspace.dependencies]
higanbana-core = { path = "crates/higanbana-core" }
higanbana-gpui-sys = { path = "crates/higanbana-gpui-sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "net", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "charset", "http2"] }
url = "2"
regex = "1"
thiserror = "2"
sha2 = "0.10"
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
urlencoding = "2"
flate2 = "1"
unrar = "0.5.8"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
rubato = "0.16"
ebur128 = "0.1"
cpal = "0.15"
souvlaki = "0.8"
dirs = "6"
open = "5"
gpui-kit = "0.9"
raw-window-handle = "0.6"
futures = "0.3"
libloading = "0.8"
image = "0.25"
tracing = "0.1"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
webp = "0.3"
cc = "1"
bindgen = "0.72"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# O binário fica em "s" pelo tamanho, mas decodificar áudio e imagem,
# reamostrar e medir loudness é laço de CPU: esses crates vão em -O3.
[profile.release.package.symphonia-core]
opt-level = 3
[profile.release.package.symphonia-bundle-flac]
opt-level = 3
[profile.release.package.symphonia-bundle-mp3]
opt-level = 3
[profile.release.package.symphonia-codec-aac]
opt-level = 3
[profile.release.package.symphonia-codec-alac]
opt-level = 3
[profile.release.package.symphonia-codec-pcm]
opt-level = 3
[profile.release.package.symphonia-codec-vorbis]
opt-level = 3
[profile.release.package.rubato]
opt-level = 3
[profile.release.package.realfft]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
[profile.release.package.ebur128]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.libwebp-sys]
opt-level = 3
